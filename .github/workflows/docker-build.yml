name: Build Docker image

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tag
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag=esxi-image-builder:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "filename=esxi-image-builder-${SHORT_SHA}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image to a compressed tarball
        run: docker save ${{ steps.vars.outputs.tag }} | gzip > ${{ steps.vars.outputs.filename }}

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.filename }}
          path: ${{ steps.vars.outputs.filename }}
          retention-days: 14
